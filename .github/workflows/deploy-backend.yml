# main에 backend 관련 변경이 push되면 이미지를 빌드해 Cloud Run에 배포한다.
# GCP 인증은 Workload Identity Federation이라 저장소에 키 파일이 없다.
# 환경변수·시크릿은 Cloud Run 서비스에 직접 설정돼 있고, 여기선 이미지만 바꾼다.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - packages/auth/**
      - packages/db/schema.prisma
      - package-lock.json
      - Dockerfile
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: admin-backend
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/admin/backend:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - run: docker build -t "$IMAGE" . && docker push "$IMAGE"

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          # API는 앱이 자체 인증한다(Supabase JWT 등). Cloud Run 단에선 공개.
          flags: >-
            --service-account=admin-backend-run@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --allow-unauthenticated
            --timeout=300
            --cpu-boost
            --memory=1Gi
            --max-instances=3
